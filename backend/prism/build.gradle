plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.16'
	id 'io.spring.dependency-management' version '1.1.7'
}

group = 'com.dontgiveup'
version = '0.0.1-SNAPSHOT'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

repositories {
	mavenCentral()
}

dependencies {
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-webflux'
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.17'
	compileOnly 'org.projectlombok:lombok'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'
	runtimeOnly 'com.h2database:h2'
	annotationProcessor 'org.projectlombok:lombok'
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
	testCompileOnly 'org.projectlombok:lombok'
	testAnnotationProcessor 'org.projectlombok:lombok'
}

tasks.named('test') {
	useJUnitPlatform()
}

// ===== 프론트엔드 빌드 통합 =====
def frontendDir = file("${rootDir}/../../frontend")
def npmCmd = System.getProperty('os.name').toLowerCase().contains('windows') ? 'npm.cmd' : 'npm'

tasks.register('npmInstall', Exec) {
	workingDir frontendDir
	commandLine npmCmd, 'install'
}

tasks.register('npmBuild', Exec) {
	dependsOn npmInstall
	workingDir frontendDir
	commandLine npmCmd, 'run', 'build'
}

tasks.register('copyFrontend', Copy) {
	// processResources가 끝난 뒤(=build/resources/main이 확정된 뒤) 그 위에 덮어써야
	// 이후 jar/bootJar 패키징 시 정적 파일이 함께 포함된다.
	dependsOn npmBuild, tasks.named('processResources')
	from "${frontendDir}/dist"
	into layout.buildDirectory.dir('resources/main/static')
}

// 배포/제출용 패키징(jar, bootJar)에만 프론트 빌드를 강제한다.
tasks.named('jar') {
	dependsOn copyFrontend
}
tasks.named('bootJar') {
	dependsOn copyFrontend
}
