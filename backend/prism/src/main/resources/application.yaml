spring:
  application:
    name: prism
  servlet:
    multipart:
      max-file-size: 15MB
      max-request-size: 15MB

upstage:
  api-key: ${UPSTAGE_API_KEY}
  base-url: https://api.upstage.ai

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    disable-swagger-default-url: true
    operations-sorter: alpha
    tags-sorter: alpha
